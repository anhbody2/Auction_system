services:
  db:
    image: postgres:16-alpine
    container_name: auction_db
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: auction
    ports:
      - "5436:5432"
    volumes:
      - auction_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  auction_pgdata:
